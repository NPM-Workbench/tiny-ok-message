# name of the workflow
name: Publish Package

# how this workflow will be triggered
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  test-package:
    #vm instance
    runs-on: ubuntu-latest

    # various tasks that would be executed
    steps:
      - name: Start Test
        run: echo "Start Package Test"

        # context object - emit
      - name: Github Context
        run: echo '${{ toJson(github) }}'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Upload Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: coverage/

      - name: End Message
        run: echo "End Package Test"

  publish:
    needs: test-package

    # vm instance
    runs-on: ubuntu-latest

    # various tasks that would be executed
    steps:
      - name: Start Message
        run: echo "Start Package Publish"

      # context object - emit
      - name: Github Context
        run: echo '${{ toJson(github) }}'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish

      - name: Pack NPM Package
        run: npm pack

      - name: Check Directory
        run: ls -la

      - name: Upload Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiny-ok-message-build
          path: "tiny-ok-message-*.tgz"

      - name: End Message
        run: echo "End Package Publish"
